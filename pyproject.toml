[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-ranking"
version = "1.0.0"
description = "Two-stage personalized vehicle ranking in online auctions with a heterogeneous GNN and LambdaRank"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
